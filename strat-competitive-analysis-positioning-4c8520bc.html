<script>const CAT_DATA = {"uk":[{"id":21,"category":"Конкурентний аналіз та позиціонування","icon":"🧩","title":"Формулювання стратегії · Конкурентний аналіз та позиціонування","description":"Практичний сценарій для ситуації «формулювання стратегії».","prompt":"Ти — CEO-консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Формулювання стратегії · Конкурентний аналіз та позиціонування»\nКомпанія виросла з 20 до 150 співробітників за два роки, але річної стратегії з чіткими пріоритетами досі немає, і кожен відділ рухається у власному напрямку.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Стадія бізнесу (стартап/зростання/зрілий): [вкажіть]\n• Розмір компанії (виручка/команда): [вкажіть]\n• Ключові стейкхолдери: [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які з п'яти сил за Портером найбільше тиснуть на позицію компанії?\n2. Яка стійка конкурентна перевага (moat) захищає бізнес?\n3. Який конкурент рухається найшвидше і в якому напрямку?\n4. Чи є простір «блакитного океану», не зайнятий конкурентами?\n5. Яке сприйняття бренду цільовою аудиторією відрізняється від бажаного?\n6. Який сигнал ринку вимагає негайної зміни позиціонування?\n\nАЛГОРИТМ\n1. Відокрем факти від припущень.\n2. Визнач головну мету цього рішення в контексті довгострокової стратегії компанії.\n3. Розглянь 2-3 альтернативні підходи та оціни їх компроміси.\n4. Побудуй поетапний план впровадження з контрольними точками.\n5. Визнач ресурси (капітал, люди, час), потрібні для реалізації.\n6. Оціни ризики та передумови успіху.\n7. Дай конкретний перший крок із рекомендованим строком.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи конфіденційні дані компанії. Спирайся на загальновизнані міжнародні управлінські концепції (OKR, Five Forces, OECD Principles of Corporate Governance, модель Коттера тощо) там, де це доречно, а не на практику однієї країни. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":22,"category":"Конкурентний аналіз та позиціонування","icon":"🧩","title":"Комплаєнс та управлінський ризик · Конкурентний аналіз та позиціонування","description":"Практичний сценарій для ситуації «комплаєнс та управлінський ризик».","prompt":"Ти — голова ради директорів. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Комплаєнс та управлінський ризик · Конкурентний аналіз та позиціонування»\nЮридичний due diligence перед раундом інвестицій виявив, що рада директорів жодного разу формально не затверджувала річний бюджет за останні два роки.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Стадія бізнесу (стартап/зростання/зрілий): [вкажіть]\n• Розмір компанії (виручка/команда): [вкажіть]\n• Ключові стейкхолдери: [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які з п'яти сил за Портером найбільше тиснуть на позицію компанії?\n2. Яка стійка конкурентна перевага (moat) захищає бізнес?\n3. Який конкурент рухається найшвидше і в якому напрямку?\n4. Чи є простір «блакитного океану», не зайнятий конкурентами?\n5. Яке сприйняття бренду цільовою аудиторією відрізняється від бажаного?\n6. Який сигнал ринку вимагає негайної зміни позиціонування?\n\nАЛГОРИТМ\n1. Визнач застосовну вимогу (принципи корпоративного управління, статут, внутрішня політика).\n2. Оціни масштаб та строк усунення невідповідності.\n3. Задокументуй факти до того, як пропонувати рішення.\n4. Визнач, хто має бути залучений для перевірки чи підтвердження (юрист, рада директорів).\n5. Сформуй план усунення з чіткими строками.\n6. Оціни ризик, якщо невідповідність не буде усунена вчасно.\n7. Запропонуй превентивний захід,  2-3 гіпотези щодо причини та перевір кожну.\n5. Визнач, яка гіпотеза найкраще пояснює дані.\n6. Запропонуй конкретну дію на основі підтвердженої причини.\n7. Визнач, який показник відстежувати, щоб підтвердити ефект дії.\n\nФОРМАТ РЕЗУЛЬТАТУ\nА. Діагноз ситуації.\nБ. Відповіді на ключові питання.\nВ. Рекомендований план дій.\nГ. Готовий текст для розмови/документа.\nД. Чого не робити.\nЕ. Наступний крок.\nЖ. Критерій успіху.\n\nНе вигадуй факти, цифри чи конфіденційні дані компанії. Спирайся на загальновизнані міжнародні управлінські концепції (OKR, Five Forces, OECD Principles of Corporate Governance, модель Коттера тощо) там, де це доречно, а не на практику однієї країни. Якщо даних бракує — постав до 5 уточнювальних питань перед остаточною рекомендацією."},{"id":39,"category":"Конкурентний аналіз та позиціонування","icon":"🧩","title":"Міжфункціональна координація на рівні C-level · Конкурентний аналіз та позиціонування","description":"Практичний сценарій для ситуації «міжфункціональна координація на рівні C-level».","prompt":"Ти — стратегічний консультант. Працюй як практик, а не як автор загальних порад.\n\nСЦЕНАРІЙ\n«Міжфункціональна координація на рівні C-level · Конкурентний аналіз та позиціонування»\nДиректор з продукту та комерційний директор мають конфліктуючі пріоритети щодо наступного релізу, і обидва апелюють напряму до CEO.\n\nВхідні дані:\n• Компанія/галузь: [вкажіть]\n• Стадія бізнесу (стартап/зростання/зрілий): [вкажіть]\n• Розмір компанії (виручка/команда): [вкажіть]\n• Ключові стейкхолдери: [вкажіть]\n• Поточний етап ситуації: [вкажіть]\n• Відомі факти: [вкажіть]\n• Мета керівника: [вкажіть]\n\nПИТАННЯ ДЛЯ ЦЬОГО СЦЕНАРІЮ\n1. Враховуючи цю ситуацію, які з п'яти сил за Портером найбільше тиснуть на позицію компанії?\n2. Яка стійка конкурентна перевага (moat) захищає бізнес?\n3. Який конкурент рухається найшвидше і в якому напрямку?\n4. Чи є простір «блакитного океану», не зайнятий конкурентами?\n5. Яке сприйняття бренду цільовою аудиторією відрізня fy]\n• Company size (revenue/team): [specify]\n• Key stakeholders: [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Leader's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, which of Porter's Five Forces exerts the most pressure on the company's position?\n2. What durable competitive advantage (moat) protects the business?\n3. Which competitor is moving fastest, and in what direction?\n4. Is there a 'blue ocean' space not occupied by competitors?\n5. How does the target audience's brand perception differ from the desired one?\n6. What market signal demands an immediate repositioning?\n\nALGORITHM\n1. Separate facts from assumptions.\n2. Identify the main goal of this decision within the company's long-term strategy.\n3. Consider 2-3 alternative approaches and weigh their trade-offs.\n4. Build a phased implementation plan with checkpoints.\n5. Identify the resources (capital, people, time) needed for execution.\n6. Assess the risks and preconditions for success.\n7. Give a concrete first step with a recommended deadline.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or confidential company data. Rely on generally accepted international management frameworks (OKRs, Five Forces, OECD Principles of Corporate Governance, Kotter's model, etc.) where relevant, not on any single country's practice. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":22,"category":"Competitive Analysis & Positioning","icon":"🧩","title":"Compliance & governance risk · Competitive Analysis & Positioning","description":"A practical scenario for the situation \"compliance & governance risk\".","prompt":"You are the Board Chair. Work like a practitioner, not like a writer of generic advice.\n\nSCENARIO\n\"Compliance & governance risk · Competitive Analysis & Positioning\"\nLegal due diligence before an investment round found the board has never formally approved the annual budget in the last two years.\n\nInput data:\n• Company/industry: [specify]\n• Business stage (startup/growth/mature): [specify]\n• Company size (revenue/team): [specify]\n• Key stakeholders: [specify]\n• Current stage of the situation: [specify]\n• Known facts: [specify]\n• Leader's goal: [specify]\n\nQUESTIONS FOR THIS SCENARIO\n1. Given this situation, which of Porter's Five Forces exerts the most pressure on the company's position?\n2. What durable competitive advantage (moat) protects the business?\n3. Which competitor is moving fastest, and in what direction?\n4. Is there a 'blue ocean' space not occupied by competitors?\n5. How does the target audience's brand perception differ from the desired one?\n6. What market signal demands an immediate repositioning?\n\nALGORITHM\n1. Identify the applicable requirement (corporate governance principles, bylaws, internal policy).\n2. Assess the scope and deadline for resolving the non-compliance.\n3. Document the facts before proposing a solution.\n4. Identify who needs to be involved to verify or confirm it (legal counsel, the board).\n5. Build a remediation plan with clear deadlines.\n6. Assess the risk if the non-compliance isn't resolved in time.\n7. Propose a preventive measure to avoid recurrence.\n\nRESULT FORMAT\nA. Diagnosis.\nB. Answers to key questions.\nC. Recommended action plan.\nD. Ready-made conversation/document text.\nE. What not to do.\nF. Next step.\nG. Success criteria.\n\nDon't invent facts, figures, or confidential company data. Rely on generally accepted international management frameworks (OKRs, Five Forces, OECD Principles of Corporate Governance, Kotter's model, etc.) where relevant, not on any single country's practice. If data is missing, ask up to 5 clarifying questions before making a final recommendation."},{"id":23,"category":"Compet
